name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NG_CLI_ANALYTICS: "false"
  # Throw-away settings for the CI database and test hosts. Nothing here is a real secret.
  CI_DB: "Host=localhost;Database=paytaxi_test;Username=postgres;Password=postgres"
  CI_JWT_KEY: "ci-only-jwt-key-0123456789-abcdefghijklmnopqrstuvwxyz"
  CI_ENC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  CI_HASH_KEY: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="

jobs:
  backend:
    name: Backend · unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: No customer documents in the repository
        shell: bash
        run: |
          # Real invoices and statements carry drivers' names, phones, licence numbers and IBANs — they stay out of git
          # (.gitignore). A tracked one here means someone forced it in: fail before it reaches the public repository.
          found=$(git ls-files -- '*.pdf' 'docs/*.jpg' 'docs/*.jpeg' 'docs/*.png' 'docs/*.heic')
          if [ -n "$found" ]; then echo "::error::Customer documents must not be committed: $found"; exit 1; fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Georgian font for the invoice PDF test (the production image installs the same package)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig fonts-noto-core > /dev/null
      - run: dotnet restore backend/PayTaxi.sln
      - run: dotnet build backend/PayTaxi.sln -c Release --no-restore
      - name: Test (unit + in-process API against Postgres)
        env:
          PAYTAXI_TEST_DB: ${{ env.CI_DB }}
        run: dotnet test backend/PayTaxi.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"

  frontend:
    name: Frontend · production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx ng build --configuration production

  e2e:
    name: End-to-end · Playwright (driver app + admin console)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: dotnet build backend/PayTaxi.Api -c Release

      - name: Start the API (Development seed, deterministic mocks)
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: ${{ env.CI_DB }}
          Jwt__Key: ${{ env.CI_JWT_KEY }}
          Encryption__Key: ${{ env.CI_ENC_KEY }}
          Encryption__HashKey: ${{ env.CI_HASH_KEY }}   # keyed lookup hashes, as production runs
          Cors__AllowedOrigins__0: http://localhost:4200
          YandexFleet__ReadOnlyMode: "false"
          YandexFleet__MockLatencyMs: "0"
          YandexFleet__MockTransientFailureRate: "0"
          BankPayout__Mock__LatencyMs: "0"
          BankPayout__Mock__TransientFailureRate: "0"
          BankPayout__Mock__AmbiguousFailureRate: "0"
          BalanceSync__Enabled: "false"
          Reconciliation__Enabled: "false"
          Settlement__Enabled: "false"
          # Placeholder Swich IBAN (same one the backend test fixture uses) so a manual settlement run
          # gets past the "not configured" guard and the alerts e2e can provoke NO_PARK_ACCOUNT.
          Settlement__SwichIban: GE12TB7100000000000001
          # The settlement e2e settles the running month instead of waiting for month end. Development/e2e
          # only — production refuses to start with it (locally it comes from appsettings.Development.json).
          Settlement__AllowOpenMonthRun: "true"
          RateLimit__AuthPerMinute: "100000"
          Auth__OtpMaxPerWindow: "50"
          # The per-phone day limits (10 codes, 10 misses per rolling 24 h) would trip repeated e2e sign-ins of the same
          # seeded drivers on a reused database; production keeps the defaults.
          Auth__OtpMaxPerDay: "1000"
          Auth__SignInFailuresBeforeLock: "1000"
        run: |
          nohup dotnet run --project backend/PayTaxi.Api -c Release --no-build --no-launch-profile --urls http://localhost:5196 > api.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5196/api/driver/me || true)
            [ "$code" = "401" ] && echo "API up" && exit 0
            sleep 2
          done
          echo "API did not start"; tail -50 api.log; exit 1

      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            playwright-report
            test-results
            api.log
