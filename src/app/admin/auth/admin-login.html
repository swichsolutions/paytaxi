<div class="login">
  <!-- Left brand panel -->
  <aside class="login__brand">
    <div class="login__brand-inner">
      <div class="login__logo-row">
        <div class="login__logo">
          <span>₾</span>
        </div>
        <div class="login__brand-text">
          <span class="login__brand-name">PayTaxi</span>
          <span class="login__brand-tag">{{ t.adminConsoleCap }}</span>
        </div>
      </div>

      <h1 class="login__headline">
        {{ t.loginHeadline1 }}<br/>
        <span class="login__headline-accent">{{ t.loginHeadline2 }}</span>
      </h1>
      <p class="login__sub">
        {{ t.loginSub }}
      </p>

      <div class="login__footer">
        <span>Swich Solutions</span>
        <span class="login__footer-dot"></span>
        <span>{{ t.loginLocation }}</span>
      </div>
    </div>
  </aside>

  <!-- Right form panel -->
  <main class="login__panel">
    <div class="login__lang" role="group" [attr.aria-label]="t.language">
      <button
        type="button"
        class="login__lang-btn"
        [class.login__lang-btn--active]="i18n.lang() === 'en'"
        (click)="i18n.setLang('en')"
      >EN</button>
      <button
        type="button"
        class="login__lang-btn"
        [class.login__lang-btn--active]="i18n.lang() === 'ka'"
        (click)="i18n.setLang('ka')"
      >ქარ</button>
    </div>

    <div class="login__form-wrap">
      <div class="login__greet">
        <span class="login__greet-tag">{{ t.loginSignInTag }}</span>
        <h2 class="login__greet-title">{{ t.loginWelcome }}</h2>
        <p class="login__greet-sub">{{ t.loginGreetSub }}</p>
      </div>

      <form class="login__form" (ngSubmit)="submit()">
        <label class="field">
          <span class="field__label">{{ t.workEmail }}</span>
          <input
            type="email"
            class="field__input"
            placeholder="manager@taxipark.ge"
            autocomplete="email"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
          />
        </label>

        <label class="field">
          <span class="field__label">
            <span>{{ t.password }}</span>
          </span>
          <input
            type="password"
            class="field__input"
            placeholder="••••••••"
            autocomplete="current-password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
          />
        </label>

        @if (error()) {
          <div class="login__error">{{ error() }}</div>
        }

        <button type="submit" class="login__submit" [disabled]="!canSubmit()">
          @if (submitting()) {
            <span class="login__spinner"></span>
            <span>{{ t.signingIn }}</span>
          } @else {
            <span>{{ t.signIn }}</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          }
        </button>
      </form>

      <p class="login__legal">
        {{ t.loginLegal }}
      </p>
    </div>
  </main>
</div>
