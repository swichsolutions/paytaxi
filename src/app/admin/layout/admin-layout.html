<div class="admin-shell" [class.admin-shell--collapsed]="!sidebarOpen()">
  <app-admin-sidebar class="admin-shell__sidebar" [collapsed]="!sidebarOpen()" />
  <app-admin-topbar class="admin-shell__topbar" (toggle)="toggleSidebar()" />
  <main class="admin-shell__content">
    @if (parkLoadFailed()) {
      <div class="park-fail" role="alert">
        <div class="park-fail__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </div>
        <h2 class="park-fail__title">{{ t.parksUnavailableTitle }}</h2>
        <p class="park-fail__text">{{ parkErrorText() }}</p>
        <button class="btn-admin btn-admin--brand" (click)="retryParks()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
          <span>{{ t.tryAgain }}</span>
        </button>
      </div>
    } @else {
      <app-admin-alert-banner />
      <router-outlet />
    }
  </main>
  <!-- Only visible at mobile breakpoint; click to dismiss the drawer -->
  <div class="admin-shell__backdrop" (click)="closeSidebar()" aria-hidden="true"></div>
</div>
