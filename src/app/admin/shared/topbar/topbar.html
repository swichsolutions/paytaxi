<header class="topbar">
  <div class="topbar__left">
    <button class="topbar__menu" (click)="emitToggle()" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="7" x2="20" y2="7"/>
        <line x1="4" y1="12" x2="20" y2="12"/>
        <line x1="4" y1="17" x2="14" y2="17"/>
      </svg>
    </button>
    <div class="topbar__crumbs">
      <span class="topbar__crumb topbar__crumb--root">Console</span>
      <svg class="topbar__crumb-sep" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
      <span class="topbar__crumb topbar__crumb--current">{{ pageTitle() }}</span>
    </div>
  </div>

  <div class="topbar__center">
    @if (parkCtx.canSwitchPark()) {
      <label class="topbar__park-picker">
        <span class="topbar__park-picker-label">Park</span>
        <select
          class="topbar__park-picker-select"
          [ngModel]="parkCtx.currentParkId()"
          (ngModelChange)="onParkChange($event)"
        >
          @for (p of parkCtx.parks(); track p.id) {
            <option [value]="p.id">{{ p.name }}</option>
          }
        </select>
      </label>
    } @else if (parkCtx.currentPark(); as p) {
      <span class="topbar__park-badge">{{ p.name }}</span>
    }
  </div>

  <div class="topbar__right">
    <button class="topbar__icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
      <span class="topbar__icon-dot"></span>
    </button>

    <div class="topbar__divider"></div>

    <div class="topbar__user-wrap">
      <button
        class="topbar__user"
        [class.topbar__user--open]="menuOpen()"
        (click)="toggleMenu()"
        aria-label="Account menu"
        [attr.aria-expanded]="menuOpen()"
      >
        <div class="topbar__avatar">{{ adminInitials() }}</div>
        <div class="topbar__user-meta">
          <span class="topbar__user-name">{{ adminName() }}</span>
          <span class="topbar__user-role">{{ adminRole() }}</span>
        </div>
        <svg class="topbar__user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      @if (menuOpen()) {
        <div class="acct-backdrop" (click)="closeMenu()"></div>
        <div class="acct-menu" role="menu">
          <div class="acct-menu__header">
            <div class="acct-menu__avatar">{{ adminInitials() }}</div>
            <div class="acct-menu__head-text">
              <div class="acct-menu__name">{{ adminName() }}</div>
              @if (admin()?.email && adminName() !== admin()?.email) {
                <div class="acct-menu__email">{{ admin()?.email }}</div>
              }
            </div>
          </div>

          <div class="acct-menu__role-row">
            <span class="acct-menu__role-dot"
                  [class.acct-menu__role-dot--super]="admin()?.role === 'super_admin'"></span>
            <span class="acct-menu__role-text">{{ adminRole() }}</span>
          </div>

          <div class="acct-menu__divider"></div>

          <button class="acct-menu__item acct-menu__item--danger" (click)="logout()" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>Sign out</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
