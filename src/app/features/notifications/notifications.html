<div class="notif-page">
  <header class="notif-head">
    <a routerLink="/dashboard" class="notif-back" [attr.aria-label]="t.back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </a>
    <h1 class="notif-title">{{ t.notifications }}</h1>
    @if (unreadCount() > 0) {
      <button class="notif-mark-all" (click)="markAllRead()">{{ t.markAllRead }}</button>
    } @else {
      <span class="notif-spacer"></span>
    }
  </header>

  <div class="notif-tabs">
    <button class="notif-tab" [class.notif-tab--active]="filter() === 'all'" (click)="setFilter('all')">
      {{ t.all }}
    </button>
    <button class="notif-tab" [class.notif-tab--active]="filter() === 'unread'" (click)="setFilter('unread')">
      {{ t.unread }}
      @if (unreadCount() > 0) {
        <span class="notif-tab__count">{{ unreadCount() }}</span>
      }
    </button>
  </div>

  <div class="notif-list">
    @for (n of list(); track n.id) {
      <button
        class="notif-row"
        [class.notif-row--unread]="!n.isRead"
        [attr.data-tone]="iconFor(n.type)"
        (click)="open(n)"
      >
        <div class="notif-row__icon" [attr.data-tone]="iconFor(n.type)">
          @switch (iconFor(n.type)) {
            @case ('success') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            }
            @case ('error') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            }
            @case ('warning') {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                <line x1="12" y1="9" x2="12" y2="13"/>
                <line x1="12" y1="17" x2="12.01" y2="17"/>
              </svg>
            }
            @default {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
            }
          }
        </div>

        <div class="notif-row__main">
          <div class="notif-row__top">
            <span class="notif-row__title">{{ n.title }}</span>
            @if (!n.isRead) { <span class="notif-row__dot"></span> }
          </div>
          <span class="notif-row__body">{{ n.body }}</span>
          <span class="notif-row__time">{{ formatRel(n.createdAt) }}</span>
        </div>

        @if (n.link) {
          <svg class="notif-row__chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 6 15 12 9 18"/>
          </svg>
        }
      </button>
    }
    @if (list().length === 0) {
      <div class="notif-empty">
        <div class="notif-empty__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
          </svg>
        </div>
        <p>{{ t.allCaughtUp }}</p>
      </div>
    }
  </div>
</div>
